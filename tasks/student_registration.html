
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-">

    <div class="container py-5">

    <div class="row justify-content-center">
    <div class="col-md-2 col-lg-6">

    <div class="card shadow border-0 rounded-4">

    <div class="card-body p-4 p-md-5">

        <h1 class="text-primary text-center mb-2">
            Student Registration Form
        </h1>

        <p class="text-secondary text-center mb-4">
            Please enter your details
        </p>

        <form onsubmit="register(event)">

            <label class="form-label">Enter name:</label>
            <input type="text" class="form-control mb-3" placeholder="Enter your name" id="name" required>

            <label class="form-label">Enter email:</label>
            <input type="email" class="form-control mb-3" placeholder="Enter your email" id="email" required>

            <label class="form-label">Enter Age:</label>
            <input type="number" class="form-control mb-3" value="" placeholder="Enter your age" id="age" required>

            <label class="form-label">Address:</label>
            <textarea class="form-control mb-3" id="address" rows="3" required></textarea>

            <label class="form-label">State:</label>
            <select class="form-select mb-3" id="state" required>
                <option value="">Enter your state</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Maharastra">Maharastra</option>
            </select>

            <label class="form-label d-block">Gender:</label>

            <div class="mb-3">
                <label class="form-check-label me-2">Male</label>
                <input class="form-check-input me-3" type="radio" value="male" name="gender" required>

                <label class="form-check-label me-2">Female</label>
                <input class="form-check-input" type="radio" value="female" name="gender" required>
            </div>

            <label class="form-label d-block">Enter skills:</label>

                <div class="mb-4">
                <label class="form-check-label me-1">HTML</label>
                <input class="form-check-input me-3" type="checkbox" value="HTML" name="skills">

                <label class="form-check-label me-1">CSS</label>
                <input class="form-check-input me-3" type="checkbox" value="CSS" name="skills">

                <label class="form-check-label me-1">Javascript</label>
                <input class="form-check-input" type="checkbox" value="Javascript" name="skills">
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-primary w-50">
                        Submit
                    </button>

                 <button type="reset" class="btn btn-outline-secondary w-50">
                        Reset
                </button>
            </div>

            </form>

            </div>
            </div>

            <div class="mt-4">
                <div class="card shadow">
                <div class="card-body">
                <h3 id="header"></h1>
               <div id="studentDetails"></div>
                </div>
                </div>
                </div>

            </div>
        </div>
    </div>

    <script src="registration.js"></script>
</body>
</html>
